<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10222E" />
    <title>Offline | Craig-T Logistics</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #10222e; color: #fff; text-align: center;
      }
      .card { max-width: 440px; }
      .mark {
        display: inline-grid; place-items: center; width: 64px; height: 64px;
        border-radius: 20px; background: #ffb81c; color: #10222e;
        font-weight: 800; font-size: 28px; margin-bottom: 20px;
      }
      h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.15; }
      p { margin-top: 12px; color: rgba(255, 255, 255, 0.65); line-height: 1.6; }
      .actions { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn {
        display: inline-flex; align-items: center; height: 48px; padding: 0 22px;
        border-radius: 999px; font-weight: 700; font-size: 15px; text-decoration: none;
      }
      .btn-primary { background: #ffb81c; color: #10222e; }
      .btn-ghost { border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">CT</div>
      <h1>You are offline.</h1>
      <p>
        This page has not been cached yet. Reconnect and try again — or send us a WhatsApp when you are back online.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Try again</a>
        <a class="btn btn-ghost" href="/contact">Contact details</a>
      </div>
    </div>
  </body>
</html>
